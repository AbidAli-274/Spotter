services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080"
    volumes:
      - cache-data:/data # persistent geocode/route/weather cache
    expose:
      - "8000" # reachable only from the frontend container
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  cache-data:
