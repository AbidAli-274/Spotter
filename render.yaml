# Render Blueprint: backend API as a Docker web service.
# The frontend is deployed separately on Vercel (see README).
services:
  - type: web
    name: truck-routing-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to the Vercel URL, e.g. https://truck-routing.vercel.app
      - key: ORS_API_KEY
        sync: false
